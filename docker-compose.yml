services:
  api1:
    image: shobon03/rinha-backend-2026-go:latest
    security_opt:
      - seccomp=unconfined
    environment:
      - GOMAXPROCS=1
      - GOGC=100
      - SOCKET_PATH=/tmp/api1.sock
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: 150MB
    volumes:
      - socket-dir:/tmp

  api2:
    image: shobon03/rinha-backend-2026-go:latest
    security_opt:
      - seccomp=unconfined
    environment:
      - GOMAXPROCS=1
      - GOGC=100
      - SOCKET_PATH=/tmp/api2.sock
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: 150MB
    volumes:
      - socket-dir:/tmp

  haproxy:
    image: haproxy:latest
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - socket-dir:/tmp
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 50MB

volumes:
  socket-dir:
