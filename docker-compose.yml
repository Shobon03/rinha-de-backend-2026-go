services:
  api1:
    image: shobon03/rinha-backend-2026-go@sha256:62dba4aa13faaa1708949f45bdae2e029ef4d373e5c09a5f06cc8d70bf21d35e
    security_opt:
      - seccomp=unconfined
    environment:
      - GOMAXPROCS=1
      - GOGC=100
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: 150MB
    networks:
      - rinha-network

  api2:
    image: shobon03/rinha-backend-2026-go@sha256:62dba4aa13faaa1708949f45bdae2e029ef4d373e5c09a5f06cc8d70bf21d35e
    security_opt:
      - seccomp=unconfined
    environment:
      - GOMAXPROCS=1
      - GOGC=100
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: 150MB
    networks:
      - rinha-network

  haproxy:
    image: haproxy:latest
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 50MB
    networks:
      - rinha-network

networks:
  rinha-network:
    driver: bridge
