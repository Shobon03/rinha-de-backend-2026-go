services:
  api1:
    image: shobon03/rinha-backend-2026-go:latest
    environment:
      - GOMAXPROCS=1
      - GOGC=800
      - SOCKET_PATH=/tmp/api1.sock
    volumes:
      - ./resources:/app/resources:ro
      - shared-socket:/tmp
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: 150MB
    networks:
      - rinha-network

  api2:
    image: shobon03/rinha-backend-2026-go:latest
    environment:
      - GOMAXPROCS=1
      - GOGC=800
      - SOCKET_PATH=/tmp/api2.sock
    volumes:
      - ./resources:/app/resources:ro
      - shared-socket:/tmp
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: 150MB
    networks:
      - rinha-network

  haproxy:
    image: haproxy:latest
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - shared-socket:/tmp:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 50MB
    networks:
      - rinha-network

networks:
  rinha-network:
    driver: bridge

volumes:
  shared-socket:
