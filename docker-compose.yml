services:
  api1:
    build: .
    volumes:
      - ./resources:/app/resources
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 150M

  api2:
    build: .
    volumes:
      - ./resources:/app/resources
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 150M

  haproxy:
    image: haproxy:latest
    ports:
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 50M
