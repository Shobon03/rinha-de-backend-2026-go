global
    maxconn 4096

defaults
    mode http
    timeout connect 5s
    timeout client 50s
    timeout server 50s

frontend http-in
    bind *:9999
    default_backend servers

backend servers
    balance roundrobin
    http-reuse always
    option httpchk GET /ready
    server api1 api1:8080 check inter 2s fall 3 rise 1 maxconn 10000
    server api2 api2:8080 check inter 2s fall 3 rise 1 maxconn 10000
